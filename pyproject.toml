[project]
name = "rr-scraper"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "html2text>=2025.4.15",
    "markdown-pdf>=1.13.2",
    "requests>=2.34.2",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/export"]
